# ============================================================
# 全向声纳驱动配置 (ROV Sonar Omni Driver)
# 运行平台: RK3588
# ============================================================

/**:
  ros__parameters:
    # ---- 网络配置 ----
    server_ip: "192.168.0.5"       # 全向声纳 IP (区别于 scanfish2 的 192.168.0.9)
    server_port: 23                # UDP 端口
    frame_id: "sonar_omni_link"    # TF 坐标系

    # ---- 声纳工作参数 ----
    range: 4                       # 量程 (米), 1-20
    start_gain: 20                 # 起始增益 (dB), 0-40
    logf: 40                       # 声扩散系数: 15/20/30/40
    absorption: 10                 # 声吸收系数 (dB/100m)
    sound_speed: 1485              # 声速 (m/s), 1300-1700
    train_angle: 0                 # 扫描中心方位 (0.1°单位), 0-3599
    sector_width: 3600             # 扇扫角度 (0.1°单位), 3600=全向PPI模式
    data_len: 1000                 # 数据长度 (最大1000)
    pulse_type: 0                  # 发射脉冲: 0=自动, 1=CW短, 2=CW长
    gate: 200                      # 剖面门限, 100-16000
    min_range: 150                 # 最小距离 (样点数), 避开盲区
    delay_us: 0                    # 发射延时 (us)
    frequency: 0                   # 频率: 0=自动, 68=低频, 221=高频

    # ---- 数据处理 ----
    rigidity_threshold: 5          # 刚性检测阈值

    # ---- 驱动参数 ----
    cmd_interval_ms: 5000          # 命令发送间隔 (ms), 维持声纳扫描
    read_rate_hz: 200.0            # 数据读取频率 (Hz)
